name: Build and Release Stronger Cast APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate .env from example if not present
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew if present
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrongerCast-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Stronger Cast Release ${{ github.ref_name }}
          body: |
            ## Stronger Cast - Podcast de Fé para Jovens 🎙️✝️
            
            Baixe o APK oficial do Stronger Cast para Android:
            - **App Nativo Android** com reprodução de episódios em áudio/vídeo.
            - **Bíblia Sagrada Offline Completa** (66 livros da Bíblia Livre).
            - **Stronger IA Bíblia & Apoio Devocional** integrado com Gemini.
            - **Devocionais diários** e canais recomendados de edificação cristã.
          draft: false
          prerelease: false
